
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>هدية عيد ميلاد ADA 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#f5c76b;--k:#ff7eb6;--p:#b46bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:#07030f;color:#f3e9ff;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
#bg{position:fixed;inset:0;z-index:0}
.au{position:fixed;width:90vmax;height:90vmax;border-radius:50%;z-index:0;opacity:.34;pointer-events:none;animation:dr 18s ease-in-out infinite alternate}
.a1{background:radial-gradient(circle,#7a2cff,transparent 60%);top:-45vmax;left:-30vmax}
.a2{background:radial-gradient(circle,#ff4fa3,transparent 60%);bottom:-50vmax;right:-35vmax;animation-delay:-6s}
.a3{background:radial-gradient(circle,#2fe0c0,transparent 60%);top:20vh;left:30vw;opacity:.13;animation-delay:-11s}
@keyframes dr{to{transform:translate(12vmax,8vmax) rotate(40deg) scale(1.15)}}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.p{position:fixed;animation:pf 1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes pf{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3) rotate(240deg);opacity:0}}
.cf{position:fixed;top:-16px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.scr{position:fixed;inset:0;z-index:2;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transform:translateY(22px) scale(.97);transition:opacity .5s,transform .5s,visibility .5s}
.scr.on{opacity:1;visibility:visible;transform:none}
.gl{background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(245,199,107,.3);border-radius:22px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2),0 0 30px rgba(180,107,255,.16)}
.btn{font-weight:900;font-size:1.1rem;border:0;border-radius:50px;padding:14px 34px;color:#2a1200;background:linear-gradient(135deg,#ffe29a,#f5c76b 50%,#ff9ec9);box-shadow:0 0 24px rgba(245,199,107,.6);cursor:pointer;transition:transform .15s;animation:gp 2.2s infinite}
.btn:active{transform:scale(.9)}
.btn:disabled{filter:grayscale(1) brightness(.5);box-shadow:none;animation:none}
@keyframes gp{50%{box-shadow:0 0 46px rgba(255,126,182,.9)}}
.sm{border:1px solid rgba(245,199,107,.5);background:rgba(255,255,255,.08);color:var(--g);border-radius:30px;padding:8px 16px;font-weight:700;cursor:pointer}
.sm:active{transform:scale(.92)}
.rise{opacity:0;animation:ri .9s var(--d) forwards}
@keyframes ri{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}to{transform:scale(1);opacity:1}}
#wl .wc{margin:auto;text-align:center;max-width:420px;padding:10px}
.crown{font-size:4rem;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 18px var(--g))}
@keyframes fl{50%{transform:translateY(-12px) rotate(4deg)}}
.sub{font-size:1.3rem;font-weight:900;color:var(--g);letter-spacing:2px;margin:6px 0}
.nm{font-size:clamp(4rem,22vw,8rem);line-height:1.1;background:linear-gradient(90deg,#ffe29a,#ff9ec9,#d2b0ff,#ffe29a);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh2 5s linear infinite;direction:ltr}
@keyframes sh2{to{background-position:200%}}
#wl p{margin:14px 0 26px;line-height:1.9;color:#dcc8ff}
#menu h2{font-size:2rem;color:var(--g);margin:6px 0}
.pg{width:100%;max-width:520px;height:12px;border-radius:12px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 4px;border:1px solid rgba(245,199,107,.3)}
.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--k),var(--g));transition:width .8s;box-shadow:0 0 12px var(--k)}
.lst{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;margin:12px 0 20px}
.gc{display:flex;align-items:center;gap:14px;padding:14px;text-align:right;color:inherit;cursor:pointer;width:100%;font-size:1rem;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.gc:active{transform:scale(.96)}
.gc .ic{font-size:2.2rem;width:62px;height:62px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:18px;background:radial-gradient(circle,rgba(180,107,255,.5),rgba(0,0,0,.3));border:1px solid rgba(245,199,107,.5)}
.gc b{display:block;font-size:1.15rem;color:#fff}
.gc small{color:#cdb6f5}
.gc em{margin-right:auto;font-style:normal;font-size:.75rem;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:#cdb6f5;white-space:nowrap}
.gc.dn{border-color:var(--g);box-shadow:0 0 24px rgba(245,199,107,.35)}
.gc.dn em{background:var(--g);color:#2a1200;font-weight:700}
.tb{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px;margin-bottom:12px}
.tb h3{font-size:1.3rem;color:var(--g)}
#gb{width:100%;max-width:520px}
.hud{display:flex;justify-content:space-between;padding:10px 18px;margin-bottom:12px;border-radius:50px}
.hud b{color:var(--g);font-size:1.15rem}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;perspective:800px}
.cd{aspect-ratio:3/4;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.cd.fl .in{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:2rem}
.bk{background:linear-gradient(135deg,#3a1572,#1a0b2e);border:1px solid rgba(245,199,107,.6);color:var(--g);box-shadow:inset 0 0 14px rgba(180,107,255,.4)}
.ft{transform:rotateY(180deg);background:linear-gradient(135deg,#fff0f8,#e0c8ff)}
.cd.ok .ft{box-shadow:0 0 22px var(--g);border:2px solid var(--g)}
.cd.bad .in{animation:sh .4s}
@keyframes sh{25%{transform:rotateY(180deg) translateX(-7px)}75%{transform:rotateY(180deg) translateX(7px)}}
.ar{position:relative;height:56vh;min-height:300px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 100%,rgba(180,107,255,.22),rgba(0,0,0,.25));border:1px solid rgba(245,199,107,.3)}
.st{position:absolute;font-size:2.4rem;padding:8px;animation:pop .3s;filter:drop-shadow(0 0 10px var(--g));cursor:pointer}
.st.gone{animation:gn .35s forwards}
@keyframes gn{to{transform:scale(2.2);opacity:0}}
.rb{width:100%;height:46vh;border:0;border-radius:26px;font-size:1.6rem;font-weight:900;color:#fff;transition:background .15s}
.rb.w{background:linear-gradient(145deg,#3a1572,#1a0b2e);border:1px solid rgba(245,199,107,.4)}
.rb.go{background:linear-gradient(145deg,#19c37d,#0b7a55);box-shadow:0 0 50px #19c37d}
.rb.bd{background:linear-gradient(145deg,#c0305a,#6b1030)}
.rb.pp{animation:pop .4s}
.res{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.res span{padding:6px 14px;border-radius:30px;background:rgba(245,199,107,.15);border:1px solid rgba(245,199,107,.5);animation:pop .4s}
.qq{padding:22px 18px}
.qq h3{font-size:1.25rem;line-height:1.7;margin-bottom:16px;color:#fff;text-align:center}
.op{display:block;width:100%;margin:10px 0;padding:14px;border-radius:16px;font-size:1.05rem;font-weight:700;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(180,107,255,.5);cursor:pointer;transition:transform .15s,background .3s}
.op:active{transform:scale(.96)}
.op.ok{background:linear-gradient(135deg,#19c37d,#0b7a55);border-color:#7dffc8;animation:pop .4s}
.op.bd{background:#8a1c40;animation:shk .4s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bl{position:absolute;bottom:-100px;width:56px;height:70px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),var(--c) 55%);box-shadow:0 0 18px var(--c);animation:up linear forwards;cursor:pointer}
.bl:after{content:"";position:absolute;bottom:-26px;left:50%;width:1px;height:26px;background:rgba(255,255,255,.5)}
.bl:before{content:"";position:absolute;inset:-12px}
@keyframes up{to{transform:translateY(calc(-56vh - 200px))}}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(7,3,15,.78);opacity:0;visibility:hidden;transition:.4s;padding:20px}
.ov.on{opacity:1;visibility:visible}
.ov .gl{padding:28px 22px;text-align:center;max-width:360px;width:100%}
.ov.on .gl{animation:pop .5s}
.big{font-size:4rem;filter:drop-shadow(0 0 16px var(--g))}
.ov h2{font-size:2rem;color:var(--g);margin:6px 0}
.ov p{margin-bottom:18px;line-height:1.8;color:#e5d6ff}
.ov .btn{display:block;width:100%;margin:10px 0;font-size:1rem}
#final{background:radial-gradient(circle at 50% 25%,#5a2400 0,#2a0a30 55%,#000 100%)}
.rays{position:fixed;inset:-60%;z-index:-1;background:repeating-conic-gradient(rgba(255,214,130,.14) 0 7deg,transparent 7deg 18deg);animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fw{margin:auto;text-align:center;max-width:440px;width:100%;padding:10px 0}
.fw .cake{font-size:5rem;animation:fl 2.5s ease-in-out infinite}
.fw h1{font-size:clamp(2rem,9vw,3rem);color:#ffe29a;text-shadow:0 0 24px #ff9ec9}
.fw .nm{font-size:clamp(4rem,24vw,8.5rem)}
.fm{margin:18px 0;padding:22px 18px;line-height:2.1;font-size:1.4rem;font-family:'Amiri',serif;text-align:center;border-color:rgba(255,226,154,.6);background:linear-gradient(145deg,rgba(255,226,154,.16),rgba(255,126,182,.07))}
.fm span{display:block;opacity:0;animation:ri .9s var(--d) forwards;padding:5px 0}
.reply-box{width:100%;margin:25px auto;padding:22px;text-align:center}
.reply-box h2{color:#f5c76b;font-family:'Amiri',serif;font-size:1.8rem;margin-bottom:8px}
.reply-box p{color:#dcc8ff;margin-bottom:15px;line-height:1.8}
.reply-box textarea{width:100%;min-height:145px;resize:vertical;border:1px solid rgba(245,199,107,.5);border-radius:16px;padding:15px;background:rgba(0,0,0,.3);color:white;font:1.2rem 'Amiri',serif;outline:none;text-align:right;user-select:text;-webkit-user-select:text}
.reply-box textarea:focus{border-color:#ff7eb6;box-shadow:0 0 18px rgba(255,126,182,.2)}
.reply-box button{margin-top:14px}
#replyStatus{margin-top:12px;color:#f5c76b;font-size:.95rem;min-height:24px}
#mute{position:fixed;bottom:12px;left:12px;z-index:30;padding:6px 12px;font-size:1.1rem}
.fb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
@media(max-width:380px){.fm{font-size:1.2rem}.mg{gap:7px}.reply-box{padding:16px}}
@media(prefers-reduced-motion:reduce){.au,.rays,.crown{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="au a1"></div><div class="au a2"></div><div class="au a3"></div>
<div id="fx"></div>
<button class="sm" id="mute" type="button" aria-label="الصوت">🔊</button>

<section class="scr on" id="wl"><div class="wc">
  <div class="crown rise" style="--d:.1s">👑</div>
  <div class="sub rise" style="--d:.3s">✦ عيد ميلاد سعيد ✦</div>
  <div class="rise" style="--d:.5s"><h1 class="ttl nm">ADA</h1></div>
  <p class="rise" style="--d:.9s">أهلاً بيكي في عالم سحري اتصنع مخصوص ليكي… خمس مراحل مليانة مفاجآت مستنياكي ✨</p>
  <div class="rise" style="--d:1.2s"><button class="btn" id="go">ابدأ الرحلة 🌙</button></div>
</div></section>

<section class="scr" id="menu">
  <h2 class="ttl">مراحل الرحلة</h2>
  <div class="pg"><i id="pb"></i></div>
  <div id="pt" style="color:#cdb6f5;font-size:.9rem">0 من 5 مراحل مكتملة</div>
  <div class="lst" id="lst"></div>
  <button class="btn" id="fbtn" disabled>🎁 افتح الهدية</button>
  <div style="height:20px;flex:none"></div>
</section>

<section class="scr" id="game">
  <div class="tb"><button class="sm" id="bk">↩ المراحل</button><h3 class="ttl" id="gt"></h3></div>
  <div id="gb"></div>
  <div class="ov" id="ov"></div>
</section>

<section class="scr" id="final"><div class="rays"></div><div class="fw" id="fin"></div></section>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var R=function(a,b){return Math.random()*(b-a)+a};
var pick=function(a){return a[Math.random()*a.length|0]};
var fx=$("#fx"),gb=$("#gb"),ov=$("#ov");

/* ---------- background stars ---------- */
var cv=$("#bg"),cx=cv.getContext("2d"),W=0,H=0,S=[];
function rs(){
  W=cv.width=innerWidth;H=cv.height=innerHeight;
  var n=Math.min(90,(W*H/9000)|0);S=[];
  for(var i=0;i<n;i++)S.push({x:R(0,W),y:R(0,H),r:R(.4,1.8),p:R(0,6),s:R(.01,.05),v:R(.05,.25),c:pick(["#fff","#f5c76b","#ffb3da","#d2b0ff"])});
}
function dw(){
  cx.clearRect(0,0,W,H);
  for(var i=0;i<S.length;i++){var o=S[i];o.p+=o.s;o.y-=o.v;if(o.y<0)o.y=H;
    cx.globalAlpha=.35+.65*Math.abs(Math.sin(o.p));cx.fillStyle=o.c;cx.beginPath();cx.arc(o.x,o.y,o.r,0,6.3);cx.fill();}
  requestAnimationFrame(dw);
}
rs();dw();addEventListener("resize",rs);

/* ---------- effects ---------- */
function burst(x,y,ch,n,d){
  n=n||10;d=d||90;
  for(var i=0;i<n;i++){
    var e=document.createElement("i");e.className="p";e.textContent=pick(ch);
    var a=R(0,6.28),r=R(d*.4,d);
    e.style.cssText="left:"+x+"px;top:"+y+"px;font-style:normal;font-size:"+R(14,26)+"px;--dx:"+Math.cos(a)*r+"px;--dy:"+Math.sin(a)*r+"px";
    fx.appendChild(e);setTimeout(function(el){el.remove()}.bind(null,e),1000);
  }
}
var COLS=["#f5c76b","#ff7eb6","#b46bff","#7df9ff","#fff"];
function cf(n){
  for(var i=0;i<n;i++){
    var e=document.createElement("i");e.className="cf";
    e.style.cssText="left:"+R(0,100)+"vw;background:"+pick(COLS)+";animation-duration:"+R(2,4)+"s;animation-delay:"+R(0,.8)+"s";
    fx.appendChild(e);setTimeout(function(el){el.remove()}.bind(null,e),5000);
  }
}
function center(el){var r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}

/* ---------- sound engine ---------- */
var AC=null,muted=false;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==="suspended"){try{AC.resume()}catch(e){}}
  return AC;
}
function tone(f,d,type,vol,delay,to){
  var a=ac();if(!a||muted)return;
  var t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.12,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
function noise(d,vol){
  var a=ac();if(!a||muted)return;
  var n=(a.sampleRate*d)|0,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
  for(var i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(),g=a.createGain();
  g.gain.value=vol||.15;s.buffer=b;s.connect(g);g.connect(a.destination);s.start();
}
var SFX={
  tap:function(){tone(660,.08,"sine",.08)},
  start:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.35,"sine",.1,i*.09)})},
  flip:function(){tone(420,.12,"triangle",.1,0,820)},
  match:function(){tone(660,.15,"sine",.12);tone(880,.2,"sine",.12,.1);tone(1320,.3,"sine",.1,.2)},
  wrong:function(){tone(220,.28,"sawtooth",.06,0,110)},
  star:function(n){tone(700+n*45,.2,"sine",.12,0,1500);tone(1800+n*30,.12,"triangle",.05,.06)},
  pop:function(){noise(.12,.22);tone(320,.1,"square",.04,0,80)},
  go:function(){tone(880,.15,"square",.06);tone(1320,.22,"square",.06,.1)},
  ok:function(){tone(784,.12,"sine",.12);tone(1047,.25,"sine",.12,.1)},
  win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.4,"triangle",.12,i*.12)});[523,659,784].forEach(function(f){tone(f,1,"sine",.07,.65)})},
  fail:function(){tone(440,.25,"sine",.1);tone(330,.25,"sine",.1,.2);tone(220,.45,"sine",.1,.4)}
};
var Music={on:false,id:0,i:0,n:[261.6,293.7,329.6,392,440,523.3,587.3,659.3],p:[0,2,4,5,4,2,3,1],
  start:function(){
    if(this.on)return;this.on=true;var m=this;
    this.id=setInterval(function(){
      if(muted||document.hidden)return;
      var k=m.p[m.i%8];tone(m.n[k],1.8,"sine",.035);
      if(m.i%8===0)tone(m.n[0]/2,4,"triangle",.03);
      if(m.i%4===2)tone(m.n[k]*2,.5,"triangle",.012,.15);
      m.i++;
    },650);
  }};
document.addEventListener("pointerdown",function(e){
  ac();
  if(e.target.closest&&e.target.closest(".btn,.sm,.gc")&&!e.target.closest("#mute"))SFX.tap();
},true);
document.addEventListener("click",function(){ac()},true);
$("#mute").onclick=function(){
  muted=!muted;this.textContent=muted?"🔇":"🔊";
  if(!muted){ac();SFX.tap()}
};

/* ---------- state / timers ---------- */
var TM=[],IV=[],FI=null,won=false,cur=-1,done=[0,0,0,0,0];
function tm(f,ms){var i=setTimeout(f,ms);TM.push(i);return i}
function iv(f,ms){var i=setInterval(f,ms);IV.push(i);return i}
function halt(){TM.forEach(clearTimeout);IV.forEach(clearInterval);TM=[];IV=[]}
function stop(){halt();gb.innerHTML="";ov.classList.remove("on")}
function show(id){document.querySelectorAll(".scr").forEach(function(s){s.classList.toggle("on",s.id===id)});
  var sc=document.getElementById(id);if(sc)sc.scrollTop=0}

var meta=[["🃏","لعبة الذاكرة","طابق الكروت واجمع القلوب"],["⭐","جمع النجوم","اجمع 12 نجمة قبل ما الوقت يخلص"],["⚡","سرعة البديهة","اضغط أسرع ما تقدر"],["🔮","الأسئلة","4 أسئلة خفيفة"],["🎈","فرقعة البالونات","فرقع 10 بالونات"]];

function renderMenu(){
  var n=done.reduce(function(a,b){return a+b},0);
  $("#pb").style.width=n*20+"%";
  $("#pt").textContent=n+" من 5 مراحل مكتملة";
  $("#lst").innerHTML=meta.map(function(m,i){
    return '<button class="gl gc'+(done[i]?" dn":"")+'" data-i="'+i+'"><span class="ic">'+m[0]+'</span><span><b>'+m[1]+'</b><small>'+m[2]+'</small></span><em>'+(done[i]?"✅ مكتملة":"المرحلة "+(i+1))+'</em></button>';
  }).join("");
  $("#fbtn").disabled=n<5;
}
$("#lst").addEventListener("click",function(e){
  var b=e.target.closest(".gc");if(b)openG(+b.dataset.i);
});
function openG(i){stop();won=false;cur=i;$("#gt").textContent=meta[i][1];G[i]();show("game")}
function toMenu(){stop();clearInterval(FI);cur=-1;renderMenu();show("menu")}
function toFinal(){stop();show("final");startFinal()}
$("#bk").onclick=toMenu;
$("#fbtn").onclick=toFinal;
$("#go").onclick=function(){
  var c=center(this);SFX.start();Music.start();burst(c[0],c[1],["✨","💜","⭐","🌙"],16,130);
  setTimeout(function(){renderMenu();show("menu")},550);
};

function showOv(ico,t,m,btns){
  ov.innerHTML='<div class="gl"><div class="big">'+ico+'</div><h2 class="ttl">'+t+'</h2><p>'+m+'</p><div></div></div>';
  var box=ov.lastChild.lastChild;
  btns.forEach(function(b){var e=document.createElement("button");e.className="btn";e.textContent=b[0];e.onclick=b[1];box.appendChild(e)});
  ov.classList.add("on");
}
function win(m){
  if(won)return;won=true;done[cur]=1;halt();
  tm(function(){
    var b=[["⬅ رجوع لقائمة المراحل",toMenu]];
    if(done.every(Boolean))b.push(["🎁 افتح الهدية",toFinal]);
    SFX.win();showOv("🏆","برافو يا ADA!",m,b);cf(60);
  },600);
}
function fail(m){
  if(won)return;won=true;halt();
  var i=cur;
  SFX.fail();showOv("🌙","محاولة حلوة!",m,[["🔁 حاول تاني",function(){openG(i)}],["⬅ رجوع للمراحل",toMenu]]);
}
function hud(a,b){return '<div class="gl hud"><span>'+a+'</span><span>'+b+'</span></div>'}

/* ---------- games ---------- */
var G=[];

G[0]=function(){
  var f=[],lock=false,m=0,e=0,em=["💜","⭐","🌙","🦋","👑","🔮"];
  var c=em.concat(em).sort(function(){return Math.random()-.5});
  gb.innerHTML=hud('أخطاء: <b id="ee">0</b>','تطابق: <b id="mm">0</b>/6')+'<div class="mg"></div>';
  var g=gb.querySelector(".mg");
  c.forEach(function(v){
    var d=document.createElement("div");d.className="cd";d.dataset.v=v;
    d.innerHTML='<div class="in"><div class="fc bk">✦</div><div class="fc ft">'+v+'</div></div>';
    d.onclick=function(){
      if(lock||won||d.classList.contains("fl"))return;
      d.classList.add("fl");SFX.flip();f.push(d);
      if(f.length<2)return;
      lock=true;var a=f[0],b=f[1];f=[];
      if(a.dataset.v===b.dataset.v){
        tm(function(){
          [a,b].forEach(function(x){var p=center(x);burst(p[0],p[1],["💖","💜","✨"],9,80);x.classList.add("ok")});
          SFX.match();m++;$("#mm").textContent=m;lock=false;
          if(m>=6)win("طابقت كل الكروت بـ "+e+" أخطاء فقط 💜");
        },500);
      }else{
        tm(function(){a.classList.add("bad");b.classList.add("bad");SFX.wrong()},450);
        tm(function(){a.classList.remove("fl","bad");b.classList.remove("fl","bad");e++;$("#ee").textContent=e;lock=false},950);
      }
    };
    g.appendChild(d);
  });
};

G[1]=function(){
  var s=0,t=30,goal=12;
  gb.innerHTML=hud('⭐ <b id="sc">0</b>/'+goal,'⏱ <b id="tt">30</b>')+'<div class="ar" id="ar"></div>';
  var ar=$("#ar");
  iv(function(){t--;$("#tt").textContent=t;if(t<=0)fail("الوقت خلص وجمعت "+s+" نجمة. جرب تاني!")},1000);
  iv(function(){
    if(won)return;
    var st=document.createElement("div");st.className="st";st.textContent="⭐";
    st.style.left=R(4,82)+"%";st.style.top=R(4,84)+"%";
    st.onpointerdown=function(){
      if(st.dataset.x||won)return;st.dataset.x=1;
      SFX.star(s);var p=center(st);burst(p[0],p[1],["✨","⭐","💫"],8,70);
      st.classList.add("gone");tm(function(){st.remove()},350);
      s++;$("#sc").textContent=s;
      if(s>=goal)win("جمعت كل النجوم في "+(30-t)+" ثانية ⭐");
    };
    ar.appendChild(st);tm(function(){st.remove()},2300);
  },650);
};

G[2]=function(){
  var r=0,ts=[],st=0,state=0,pid=0;
  gb.innerHTML=hud('الجولة <b id="rr">1</b>/3','اضغط لما يبقى أخضر')+'<button class="rb w" id="rb">اضغط للبدء</button><div class="res" id="rs"></div>';
  var b=$("#rb");
  function arm(){
    state=1;b.className="rb w";b.textContent="استنى... 🌙";
    pid=tm(function(){state=2;SFX.go();st=performance.now();b.className="rb go";b.textContent="دلوقتي! ⚡"},R(1500,4000));
  }
  b.onpointerdown=function(){
    if(won)return;
    if(state===0){arm();return}
    if(state===1){clearTimeout(pid);SFX.wrong();state=0;b.className="rb bd";b.textContent="بدري أوي! اضغط وحاول تاني";return}
    if(state===2){
      var x=Math.round(performance.now()-st);ts.push(x);r++;state=3;
      b.className="rb w pp";b.textContent=x+" ms ⚡";
      $("#rs").insertAdjacentHTML("beforeend","<span>"+x+" ms</span>");
      SFX.ok();var p=center(b);burst(p[0],p[1],["⚡","✨"],10,100);
      if(r>=3){
        var avg=Math.round(ts.reduce(function(a,c){return a+c},0)/3);
        tm(function(){win("متوسط زمن استجابتك "+avg+" ms ⚡")},900);
      }else{$("#rr").textContent=r+1;tm(arm,1200)}
    }
  };
};

G[3]=function(){
  var Q=[
    {q:"إيه أكتر حاجة ممكن تخلّي اليوم ده ذكرى مميزة؟",o:["الناس اللي بنحبهم 💜","الضحك والفرحة 😂","الهدايا والمفاجآت 🎁","اللحظات الحلوة ✨"]},
    {q:"إيه اللي بيخلي اليوم مميز؟",o:["القلوب الطيبة","الذكريات الجميلة","الأصدقاء الحقيقيين","كل اللي فات 🌟"]},
    {q:"عرفتني فين؟",o:["جوتاي","سكاي","تيتان","مارفيل"],c:2},
    {q:"وش كان يقولك بوت ساي لما تقولي له قول مياو؟",o:["كلخرا","يعم غور","ياليل","يلعن"],c:0}
  ];
  var i=0,lock=false;
  function render(){
    lock=false;var q=Q[i];
    gb.innerHTML=hud('السؤال <b>'+(i+1)+'</b>/4','🔮')+'<div class="gl qq"><h3>'+q.q+'</h3><div id="ops"></div></div>';
    q.o.forEach(function(t,k){
      var b=document.createElement("button");b.className="op";b.textContent=t;
      b.onclick=function(){
        if(lock||won)return;
        var p=center(b);
        if(q.c===undefined){
          lock=true;SFX.ok();b.classList.add("ok");burst(p[0],p[1],["💖","✨"],10,90);
          tm(function(){i++;render()},850);
        }else if(k===q.c){
          lock=true;SFX.ok();b.classList.add("ok");burst(p[0],p[1],["💖","⭐","✨"],14,110);
          tm(function(){
            if(i<Q.length-1){
              i++;
              render();
            }else{
              win("إجابة صح! بوت ساي فاكر المياو 💜");
            }
          },800);
        }else{
          SFX.wrong();b.classList.add("bd");tm(function(){b.classList.remove("bd")},450);
        }
      };
      $("#ops").appendChild(b);
    });
  }
  render();
};

G[4]=function(){
  var n=0,goal=10,cols=["#ff4fa3","#b46bff","#f5c76b","#2fe0c0","#4fa8ff"];
  gb.innerHTML=hud('🎈 <b id="bn">0</b>/'+goal,'فرقع البالونات')+'<div class="ar" id="ar"></div>';
  var ar=$("#ar");
  iv(function(){
    if(won)return;
    var b=document.createElement("div");b.className="bl";
    b.style.cssText="left:"+R(2,80)+"%;--c:"+pick(cols)+";animation-duration:"+R(4.5,7)+"s";
    b.onpointerdown=function(){
      if(b.dataset.x||won)return;b.dataset.x=1;
      SFX.pop();var p=center(b);burst(p[0],p[1],["✨","💖","🎉","⭐"],12,100);
      b.remove();n++;$("#bn").textContent=n;
      if(n>=goal)win("فرّقت كل البالونات 🎈🎉");
    };
    b.onanimationend=function(){b.remove()};
    ar.appendChild(b);
  },620);
};

/* ---------- final message for ADA ---------- */
function startFinal(){
 $("#fin").innerHTML=
  '<div class="cake">🎂</div>'+
  '<h1 class="ttl rise" style="--d:.2s">كل سنة وانتي طيبة</h1>'+
  '<div class="rise" style="--d:.5s"><h1 class="ttl nm">ADA</h1></div>'+
  '<div class="gl fm">'+
  '<span style="--d:1s">كل سنه وانتي طيبه</span>'+
  '<span style="--d:2.2s">عارف ان الهديا جات متاخر بس ان تصل متاخر احسن من انك متوصلش خالص</span>'+
  '<span style="--d:3.4s">المهم يعني كل سنه وانتي طيبه ويارب دايم تكوني بخير وتفضلي فرحانه علي طول</span>'+
  '<span style="--d:4.6s">يلا كــل ســنــه وانــتــي طــيــبــه ويــارب دايــم تــكــونــي فــرحــانــه وتــحــقــيــقــي الــي نــفــســك فــيــه</span>'+
  '<span style="--d:5.8s">ووعد برجع بوت ساي مخصوص عشانك عشان بس يقولك كلخرا</span>'+
  '</div>'+
  '<form class="gl reply-box" id="replyForm">'+
  '<h2>ورسالتك ليا؟</h2>'+
  '<p>أكيد مش هينفع الهدية تخلص من غير ما أسمع منك. اكتبلي كل اللي نفسك تقوله</p>'+
  '<textarea id="herReply" name="message" placeholder="اكتب رسالتك هنا..." required></textarea>'+
  '<input type="hidden" name="_subject" value="رسالة جديدة من ADA">'+
  '<input type="hidden" name="sender" value="ADA">'+
  '<button class="btn" id="sendReply" type="button">إرسال رسالتك</button>'+
  '<div id="replyStatus" role="status" aria-live="polite"></div>'+
  '</form>'+
  '<div class="fb">'+
  '<button class="btn" type="button" id="again">احتفال تاني</button>'+
  '<button class="sm" type="button" id="fback">رجوع للمراحل</button>'+
  '</div>';

 var form=$("#replyForm");
 var msg=$("#herReply");
 var status=$("#replyStatus");
 var button=$("#sendReply");
 var sending=false;

 button.addEventListener("click",sendReply);

 form.addEventListener("submit",function(e){
  e.preventDefault();
  sendReply();
 });

 async function sendReply(){
  if(sending)return;

  var value=msg.value.trim();

  if(!value){
   status.textContent="اكتب رسالتك الأول";
   SFX.wrong();
   msg.focus();
   return;
  }

  sending=true;
  button.disabled=true;
  button.textContent="جاري الإرسال...";
  status.textContent="بنحاول نبعت رسالتك دلوقتي...";

  try{
   var response=await fetch("https://formspree.io/f/xppzronk",{
    method:"POST",
    body:new FormData(form),
    headers:{Accept:"application/json"}
   });

   var result={};

   try{
    result=await response.json();
   }catch(e){}

   if(response.ok&&!result.errors){
    status.textContent="تم إرسال رسالتك بنجاح";
    SFX.win();
    cf(50);
    msg.value="";
    button.textContent="تم الإرسال";
   }else{
    var reason=result.errors
     ?result.errors.map(function(x){return x.message}).join(" - ")
     :"رمز الخطأ "+response.status;

    status.textContent="فشل الإرسال: "+reason;
    SFX.wrong();
    button.disabled=false;
    button.textContent="إعادة المحاولة";
    sending=false;
   }

  }catch(error){
   status.textContent="تعذر الاتصال بخدمة الإرسال. اتأكد من الإنترنت وحاول تاني";
   SFX.wrong();
   button.disabled=false;
   button.textContent="إعادة المحاولة";
   sending=false;
  }
 }

 $("#again").onclick=function(){
  SFX.win();
  cf(80);
  burst(innerWidth/2,innerHeight/2,["⭐","💜","💖","✨"],24,200);
 };

 $("#fback").onclick=toMenu;

 SFX.win();
 clearInterval(FI);
 cf(80);

 FI=setInterval(function(){
  burst(R(30,innerWidth-30),R(60,innerHeight*.6),["⭐","💜","💖","✨","🌟"],8,120);
  cf(6);
 },1100);
}

})();
</script>
